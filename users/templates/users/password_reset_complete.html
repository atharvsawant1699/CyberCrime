{% extends "users/base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block main_container %}
<main class="grow flex items-center justify-center p-6 relative overflow-hidden py-16">
    <div class="absolute inset-0 z-0 pointer-events-none opacity-20">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-success/10 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-primary/10 blur-[100px]"></div>
    </div>
    <section class="w-full max-w-[480px] z-10 text-center">
        <div class="bg-white p-8 md:p-10 rounded-xl shadow-xl border border-outline-variant">
            <div class="w-16 h-16 bg-success/10 rounded-full flex items-center justify-center text-success mx-auto mb-4">
                <span class="material-symbols-outlined text-3xl">verified</span>
            </div>
            <h3 class="mb-3 text-success font-headline-md text-headline-md">Password Reset!</h3>
            <p class="font-body-base text-on-surface-variant text-sm mb-6">
                Your password has been reset successfully. You can now login using your new credentials.
            </p>
            <div class="mt-8">
                <a class="px-6 py-3 bg-primary text-on-primary font-bold rounded-lg hover:opacity-90 shadow-md transition-all no-underline inline-block text-white" href="{% url 'login' %}">
                    Login Now
                </a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
